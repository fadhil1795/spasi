version: '3.8'

services:
  spasi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spasi-web
    restart: always
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=${DATABASE_URL:-mysql://spasi_user:spasi_secret_password@spasi-mysql:3306/spasi_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3005}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme-production-secret-key-32chars}
      - AUTO_DB_PUSH=${AUTO_DB_PUSH:-true}
      - SEED_DB=${SEED_DB:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - WHATSAPP_GATEWAY_PROVIDER=${WHATSAPP_GATEWAY_PROVIDER}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - WHATSAPP_INSTANCE_NAME=${WHATSAPP_INSTANCE_NAME}
    volumes:
      - spasi_uploads:/app/public/uploads
    depends_on:
      spasi-mysql:
        condition: service_healthy

  spasi-mysql:
    image: mysql:8.0
    container_name: spasi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: spasi_db
      MYSQL_USER: spasi_user
      MYSQL_PASSWORD: spasi_secret_password
    ports:
      - "3306:3306"
    volumes:
      - spasi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  spasi_uploads:
  spasi_mysql_data:
